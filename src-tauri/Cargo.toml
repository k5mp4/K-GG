[package]
name = "kagaribi_grad"
version = "1.2.0"
description = "KAGARIBI Grad desktop app"
authors = ["KAGARIBI"]
edition = "2021"

[lib]
name = "kagaribi_grad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
# Spout output shares frame memory with the renderer through WebView2 SharedBuffer.
# Versions match the ones Tauri's wry runtime already uses.
webview2-com = "0.38"
windows-core = "0.61"
